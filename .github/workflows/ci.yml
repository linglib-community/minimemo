name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: the implementation does not import the theory
        run: "! grep -rn 'import MinimemoTheory' Minimemo Minimemo.lean"
      - name: run the tests
        run: lake test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compare with memo
        run: |
          pip install memo-lang==1.3.3 pytest matplotlib pandas seaborn tqdm ipython scipy
          git clone --depth 1 https://github.com/kach/memo memo-src
          pytest
      - name: report on memo's demos
        run: python scripts/demos.py "$PWD/memo-src/demo"
