name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: the implementation does not import the theory
        run: "! grep -rn 'import MinimemoTheory' Minimemo Minimemo.lean"
      - name: run the tests
        run: lake test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install memo-lang==1.3.3
      - name: compare with memo on the example models
        run: python scripts/difftest.py
      - name: compare with memo on models with the exponential, in floating point
        run: python scripts/difftest.py examples_exp
      - name: compare with memo on random models
        run: |
          for seed in 1 2 3 4; do
            python scripts/fuzz.py $seed 25
            python scripts/difftest.py fuzz_models -v
          done
      - name: run memo's own tests
        run: |
          pip install matplotlib pandas seaborn tqdm ipython scipy
          git clone --depth 1 https://github.com/kach/memo memo-src
          python scripts/memotests.py "$PWD/memo-src/demo/test.py"
      - name: report on memo's demos
        run: |
          python scripts/demos.py "$PWD/memo-src/demo"
